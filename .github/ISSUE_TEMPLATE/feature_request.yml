name: Feature request
description: Propose a change or an addition
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the plugin does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? A new option, a different default, another provider shape…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Retry / cooldown behaviour
        - Request rewrite / cascade selection
        - Provider support
        - Configuration options
        - Logging
        - Documentation
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: Existing configurations keep their current behaviour (new behaviour is opt-in).
        - label: I searched existing issues.
